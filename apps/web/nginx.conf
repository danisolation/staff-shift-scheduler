# nginx config for the Staff Shift Scheduler frontend.
#
# Two jobs:
# 1. Serve the Vite-built static files (SPA).
# 2. Proxy /api requests to the NestJS backend (api:3000).
#
# The "try_files" directive is the key to SPA routing: when the browser
# asks for /schedule (a client-side route), nginx looks for a file called
# /schedule — it doesn't exist on disk, so it falls back to /index.html,
# which boots React Router and renders the correct page.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the NestJS backend.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets with a long cache (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every other request → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
