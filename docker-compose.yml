# Staff Shift Scheduler — full stack.
#
# Run `docker compose up --build` to start everything:
#   - db        PostgreSQL 16 (dev database, data persisted in a volume)
#   - api       NestJS REST API (port 3000)
#   - optimizer HiGHS.js model server (port 3002)
#   - web       nginx serving the React SPA + proxying /api (port 80)
#
# The test-db service is NOT part of the production stack — it exists
# only for local integration test runs (`docker compose up test-db`).
#
# Architecture:
#   browser → web (nginx :80) → /api → api (NestJS :3000) → db (Postgres :5432)
#                                api → optimizer (HiGHS :3002)

services:
  # ---------- Database (dev) ----------
  db:
    image: postgres:16-alpine
    container_name: scheduler-db
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- API (NestJS) ----------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scheduler-api
    ports:
      - "3000:3000"
    environment:
      # Inside the compose network, the database hostname is "db" (not localhost).
      DATABASE_URL: "postgresql://scheduler:scheduler@db:5432/scheduler?schema=public"
      PORT: "3000"
      OPTIMIZER_BASE_URL: "http://optimizer:3002"
      JWT_SECRET: "docker-jwt-secret-change-me-in-production-32chars!"
    depends_on:
      db:
        condition: service_healthy

  # ---------- Optimizer (HiGHS.js) ----------
  optimizer:
    build:
      context: .
      dockerfile: apps/optimizer/Dockerfile
    container_name: scheduler-optimizer
    ports:
      - "3002:3002"
    environment:
      OPTIMIZER_PORT: "3002"

  # ---------- Web (nginx + React SPA) ----------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: scheduler-web
    ports:
      - "80:80"
    depends_on:
      - api

  # ---------- Test database (not part of the production stack) ----------
  test-db:
    image: postgres:16-alpine
    container_name: scheduler-test-db
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
